{
  "api_spec": {
    "id": "RFDS-002",
    "version": "1.1"
  },
  "library": {
    "name": "rf_hp34401a",
    "module": "rf_hp34401a.Hp34401ALibrary",
    "package_version": "26.07",
    "api_version": "1.1.0",
    "scope": "SUITE",
    "scope_rationale": "Each suite owns deterministic named DMM sessions and teardown.",
    "auto_keywords": false,
    "teardown_policy": "outputs_unchanged"
  },
  "concurrency": {
    "model": "thread_safe_per_alias",
    "notes": "One core operation lock protects each physical session; orchestration remains sequential per alias."
  },
  "simulation": {
    "supported": true,
    "selector": "resource_prefix",
    "selector_value": "SIM::"
  },
  "raw_io": {
    "enabled_by_default": false,
    "encoding": "ascii",
    "terminator": "\\n",
    "opt_in_keyword": "Set Raw I/O Enabled"
  },
  "capabilities": [
    "ac_current_measurement",
    "ac_voltage_measurement",
    "capability_discovery",
    "configuration",
    "connection",
    "continuity_measurement",
    "dc_current_measurement",
    "dc_voltage_measurement",
    "device_reset",
    "diagnostics",
    "diode_measurement",
    "error_queue",
    "four_wire_resistance_measurement",
    "frequency_measurement",
    "identity",
    "measurement_assertions",
    "multi_connection",
    "period_measurement",
    "raw_io",
    "self_test",
    "simulation",
    "stable_resistance_measurement",
    "terminal_verification",
    "triggered_acquisition",
    "two_wire_resistance_measurement"
  ],
  "capabilities_not_applicable": [
    {
      "id": "relay_control",
      "reason": "The 34401A has no general-purpose relay-control capability."
    },
    {
      "id": "output_control",
      "reason": "The DMM does not source or energize a persistent output."
    },
    {
      "id": "file_transfer",
      "reason": "The supported 34401A command profile exposes no device filesystem."
    },
    {
      "id": "safe_shutdown",
      "reason": "The DMM does not create a persistent hazardous output; Disconnect is the safe teardown."
    }
  ],
  "schemas": {
    "connection_state": {
      "required_keys": [
        "alias",
        "resource",
        "connected",
        "communication_ok",
        "transport",
        "identity",
        "timeout_s",
        "state",
        "simulated"
      ]
    },
    "measurement_reading": {
      "required_keys": [
        "timestamp_utc",
        "function",
        "value",
        "unit",
        "is_valid",
        "is_overload",
        "alias"
      ]
    },
    "driver_specific_dictionary": {
      "additional_properties": true
    }
  },
  "error_codes": [
    {
      "code": "RFDS-VAL-001",
      "category": "DriverValidationError",
      "retryable": false,
      "recovery": "correct input"
    },
    {
      "code": "RFDS-STATE-001",
      "category": "DriverStateError",
      "retryable": false,
      "recovery": "establish required state"
    },
    {
      "code": "RFDS-CONN-001",
      "category": "DriverConnectionError",
      "retryable": true,
      "recovery": "verify resource and reconnect"
    },
    {
      "code": "RFDS-TR-001",
      "category": "DriverTransportError",
      "retryable": false,
      "recovery": "recover or reconnect"
    },
    {
      "code": "RFDS-PROTO-001",
      "category": "DriverProtocolError",
      "retryable": false,
      "recovery": "inspect response and error queue"
    },
    {
      "code": "RFDS-TMO-001",
      "category": "DriverTimeoutError",
      "retryable": true,
      "recovery": "retry only if operation is retry-safe"
    },
    {
      "code": "RFDS-DEV-001",
      "category": "DriverDeviceError",
      "retryable": false,
      "recovery": "inspect device error queue"
    },
    {
      "code": "RFDS-CLEAN-001",
      "category": "DriverCleanupError",
      "retryable": true,
      "recovery": "verify resource release"
    }
  ],
