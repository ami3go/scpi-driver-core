name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python scripts/generate_ai_contract.py --check
      - run: python scripts/verify_project_package.py --source . --expected-release 26.07
      - run: python -m ruff check .
      - run: python -m mypy keysight_n6700 KeysightN6700Library
      - run: python -m pytest -m "not hardware"
      - run: python -m robot --outputdir build/robot-results tests/robot
      - run: python -m robot --outputdir build/example-results examples/robot
      - run: python -m robot.libdoc KeysightN6700Library docs/KeysightN6700Library.html
      - run: python -m mkdocs build --strict --clean
