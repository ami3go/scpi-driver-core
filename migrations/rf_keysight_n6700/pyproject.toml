[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "robotframework-keysight-n6700"
version = "26.9.0"
description = "Robot Framework library and typed Python driver for Keysight/Agilent N6700 modular power systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandr Chasnyk" }]
keywords = ["robotframework", "keysight", "agilent", "n6700", "power-supply", "smu", "test-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Robot Framework",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "robotframework>=7.0,<9",
  "pyvisa>=1.14",
  "typing_extensions>=4.8; python_version < '3.11'",
]

[project.optional-dependencies]
visa-py = ["pyvisa-py>=0.7"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.13",
  "build>=1.2",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.27"]
pandas = ["pandas"]

[project.scripts]
n6700ctl = "keysight_n6700.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["keysight_n6700", "KeysightN6700Library", "rf_keysight_n6700"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
markers = [
  "hardware: tests that require real hardware",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["keysight_n6700", "KeysightN6700Library", "rf_keysight_n6700"]
warn_unused_configs = true
strict = true

[[tool.mypy.overrides]]
module = "KeysightN6700Library.*"
warn_return_any = false
