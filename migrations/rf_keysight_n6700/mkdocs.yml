site_name: RF Keysight N6700
site_description: Robot Framework library and Python driver for Keysight/Agilent N6700 modular power systems
repo_name: rf_keysight_n6700

strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
