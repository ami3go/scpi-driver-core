        {
          "name": "reset_on_connect",
          "type": "Any",
          "required": false,
          "description": "Explicitly reset the instrument after opening. Unsafe for unknown live setups.",
          "default": false
        },
        {
          "name": "clear_errors_on_connect",
          "type": "Any",
          "required": false,
          "description": "Explicitly drain/clear stale instrument errors after opening.",
          "default": false
        },
        {
          "name": "audit_log_path",
          "type": "str | None",
          "required": false,
          "description": "Optional path for command/response audit logging.",
          "default": null
        },
        {
          "name": "replace",
          "type": "Any",
          "required": false,
          "description": "Permit replacement of an existing session with the same alias.",
          "default": false
        }
      ],
      "outputs": {
        "type": "str",
        "description": "Robot-compatible result from Connect To N6700. Dictionaries/lists contain Python primitives."
