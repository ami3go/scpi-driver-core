  "safety_rules": [
    {
      "id": "SAFE-001",
      "severity": "critical",
      "rule": "Never enable a source output or load input until wiring, polarity, DUT absolute maxima, current limit, voltage limit, and protection thresholds are approved."
    },
    {
      "id": "SAFE-002",
      "severity": "critical",
      "rule": "Treat Write N6700 SCPI as unrestricted. Use typed keywords unless the exact command is reviewed and represented in the test plan."
    },
    {
      "id": "SAFE-003",
      "severity": "high",
      "rule": "Connect non-invasively. Keep reset_on_connect and clear_errors_on_connect false unless the test owns the complete bench state."
    },
    {
      "id": "SAFE-004",
      "severity": "high",
      "rule": "After connect, query output/load-input and protection states; do not assume the instrument is de-energized."
    },
    {
      "id": "SAFE-005",
      "severity": "high",
      "rule": "Clear protection only after removing the root cause and disabling the affected channel. Do not restore output automatically unless explicitly justified."
    },
    {
      "id": "SAFE-006",
      "severity": "high",
      "rule": "A software shutdown attempt is not an emergency stop. Bench hardware interlocks and operator disconnect procedures remain mandatory."
    },
    {
      "id": "SAFE-007",
      "severity": "medium",
      "rule": "Serialize state-changing operations per session/channel; query interruption and race conditions are unsafe."
    },
    {
      "id": "SAFE-008",
      "severity": "medium",
      "rule": "Apply DUT-specific settling time after every energization or setpoint step before judging measurements."
    },
    {
      "id": "SAFE-009",
      "severity": "high",
      "rule": "Real electronic-load operation is prohibited unless the installed module is explicitly verified by the driver's module capability map and the bench contract."
    }
  ],
  "verification_objectives": [
    {
      "id": "VO-IDENTITY",
      "objective": "Connected instrument identity and firmware are captured.",
      "oracle": "manufacturer, model, serial and firmware are non-empty and match the approved bench record."
    },
    {
      "id": "VO-MODULE-MAP",
      "objective": "Installed modules and capabilities are known before channel use.",
      "oracle": "Discover N6700 Modules returns each planned channel and required capability."
    },
    {
      "id": "VO-SAFE-START",
      "objective": "Planned channels start de-energized.",
      "oracle": "Get N6700 Output State or Get N6700 Load Input State is false for every owned channel."
    },
    {
      "id": "VO-SETPOINT",
      "objective": "Programmed setpoints and protection are accepted.",
      "oracle": "Readback equals requested value within instrument resolution and Check N6700 Errors passes."
    },
    {
      "id": "VO-OUTPUT",
      "objective": "Output/input state follows explicit commands.",
      "oracle": "State readback matches requested boolean and no protection is active."
    },
    {
      "id": "VO-MEASUREMENT",
      "objective": "Measured quantity satisfies approved limits.",
      "oracle": "Built-in Should Be keyword passes or explicit numeric comparison uses approved tolerance."
    },
    {
      "id": "VO-PROTECTION",
      "objective": "Protection behavior is observable and recoverable without automatic re-energization.",
      "oracle": "Trip is reported, channel is off, cause removed, clear succeeds, output remains off by default."
    },
    {
      "id": "VO-SHUTDOWN",
      "objective": "All controlled energy paths are disabled at test end.",
      "oracle": "Shutdown All N6700 Channels reports success and state readback confirms off before disconnect."
    }
  ],
  "setup_teardown_contract": {
    "recommended_library_import": "Library    KeysightN6700Library    auto_shutdown=${TRUE}    strict_errors=${TRUE}",
    "setup_sequence": [
      "Connect with a unique alias using non-invasive defaults.",
      "Capture identity and firmware.",
      "Discover installed modules and validate required capabilities.",
      "Read output/load-input and protection state for every owned channel.",
      "Force owned channels off before applying configuration.",
      "Program conservative limits and verify SCPI error queue is empty."
    ],
    "teardown_sequence": [
      "Disable each active output/load input.",
      "Call Shutdown All N6700 Channels and record the result.",
      "Check/drain errors and capture final protection state when relevant.",
      "Disconnect N6700 or Disconnect All N6700.",
      "Escalate any shutdown/close failure; do not report a clean test solely because teardown continued."
    ],
    "failure_teardown": "Use Run Keyword And Ignore Error only to continue collecting shutdown evidence; preserve the original failure and any cleanup failure."
  },
  "limitations": [
    "Channel address validation is 1..4; actual installed channel count and module types must be discovered.",
    "Module electrical ranges are not globally hard-coded in the Robot adapter; the instrument/module and approved bench limits are authoritative.",
    "Internal measurements are not a substitute for an independently calibrated DMM when traceable accuracy is required.",
    "Real electronic-load commands remain intentionally restricted for unverified physical load modules; the bundled SIM_LOAD is intended for automated tests.",
    "No driver keyword can prove external wiring, polarity, fixture rating, DUT state, or emergency-stop availability.",
    "Raw SCPI may access functionality not represented by this contract and invalidates capability-level safety assumptions.",
    "Automatic shutdown is best-effort and can fail during transport loss or hardware fault."
  ],
  "planning_hints": [
    "Prefer typed keywords over raw SCPI.",
    "Start with identity, module discovery, and read-only state capture.",
    "Configure limits while output/load input is off, then verify readback before enabling.",
    "Use one alias per physical mainframe and reserve channels explicitly in multi-driver plans.",
    "After setpoint or output changes, apply stabilization from the requirement or system bench contract before measurement.",
    "Use an external DMM as preferred source when the system contract declares one for voltage/current accuracy.",
    "End every energy-producing or sinking workflow with explicit off verification and shutdown evidence."
  ],
  "unknown_handling": {
    "policy": "fail_closed",
    "rules": [
      "UNKNOWN module capability: do not issue state-changing channel commands.",
      "UNKNOWN wiring or DUT limits: do not enable output/load input.",
      "UNKNOWN stabilization time: require an approved test-plan value before pass/fail measurement.",
      "UNKNOWN protection/interlock state: command off and request operator review.",
      "UNKNOWN result after timeout/communication loss: treat state as potentially energized and invoke bench emergency workflow.",
      "UNKNOWN raw SCPI effect: prohibit command."
    ]
  },
  "conformance_rules": {
    "keyword_coverage": "Exactly one capability entry must exist for every @keyword in KeysightN6700Library/library.py.",
