      "signature": "Connect To N6700(resource: str = '', alias: str = 'default', connection_type: str = 'visa', port: Any = 5025, discover: Any = True, reset_on_connect: Any = False, clear_errors_on_connect: Any = False, audit_log_path: str | None = None, replace: Any = False) -> str",
