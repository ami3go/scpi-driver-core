{
  "contract_standard": {
    "id": "RFDS-017",
    "version": "3.0",
    "status": "draft-source-conformant"
  },
  "contract_version": "1.0",
  "identity": {
    "driver_id": "keysight_n6700",
    "driver_name": "Keysight N6700 Robot Framework Driver",
    "release": "26.09",
    "python_distribution": "robotframework-keysight-n6700",
    "python_version": "26.9.0",
    "archive": "rf_keysight_n6700_v26.09.zip",
    "internal_root": "rf_keysight_n6700",
    "robot_library_import": "KeysightN6700Library",
    "robot_library_class": "KeysightN6700Library.KeysightN6700Library",
    "library_scope": "SUITE",
    "supported_family": "Keysight/Agilent N6700-series modular power systems",
    "channel_address_space": [
      1,
      2,
      3,
      4
    ],
    "authoritative_keyword_source": "KeysightN6700Library/library.py"
  },
  "mental_model": {
    "summary": "One N6700 mainframe session exposes up to four independently addressed module channels. Installed modules determine whether a channel acts as a power source, SMU, measurement source, or verified electronic load.",
    "session_model": "Multiple named sessions may exist; one alias is current. Most keywords accept an optional alias override.",
    "state_ownership": "The library tracks sessions and aliases, while the instrument is the authority for channel configuration, output state, protection state, and measurements.",
    "safety_model": "Typed configuration defaults outputs/load inputs off. Suite teardown and disconnect attempt shutdown when auto_shutdown is true. Raw SCPI bypasses typed safeguards."
  },
  "state_machine": {
    "initial_state": "DISCONNECTED",
    "states": {
      "DISCONNECTED": "No transport resource is open.",
      "CONNECTED_SAFE_UNKNOWN": "Session open; identity known; channel states must be queried before assuming safety.",
      "CONFIGURED_OUTPUT_OFF": "Setpoints/protection configured and output/load input confirmed off.",
      "ENERGIZED_OR_SINKING": "At least one source output or load input is on.",
      "PROTECTION_TRIPPED": "Channel protection indicates a trip or interlock.",
      "FAULTED": "Communication, SCPI, verification, or shutdown failure requires operator review."
    },
    "transitions": [
      {
        "from": "DISCONNECTED",
        "to": "CONNECTED_SAFE_UNKNOWN",
        "keywords": [
          "Connect To N6700",
          "Connect To Simulated N6700",
          "Connect To N6700 Via VISA",
          "Connect To N6700 Via Ethernet"
        ]
      },
      {
        "from": "CONNECTED_SAFE_UNKNOWN",
        "to": "CONFIGURED_OUTPUT_OFF",
        "rule": "Discover modules, query state, configure limits with outputs off."
      },
      {
        "from": "CONFIGURED_OUTPUT_OFF",
        "to": "ENERGIZED_OR_SINKING",
        "rule": "Explicit output/load-input enable only after approved preconditions."
      },
      {
        "from": "ENERGIZED_OR_SINKING",
        "to": "CONFIGURED_OUTPUT_OFF",
        "rule": "Turn off target channel(s) and verify state."
      },
      {
        "from": "ANY_CONNECTED",
        "to": "PROTECTION_TRIPPED",
        "rule": "Protection/interlock reports active fault."
      },
      {
        "from": "PROTECTION_TRIPPED",
        "to": "CONFIGURED_OUTPUT_OFF",
        "rule": "Remove cause, force output off, clear protection, verify cleared."
      },
      {
        "from": "ANY_CONNECTED",
        "to": "DISCONNECTED",
        "rule": "Shutdown then disconnect; investigate any cleanup failure."
      },
      {
        "from": "ANY",
        "to": "FAULTED",
        "rule": "Unresolved communication, command, verification, or safety error."
      }
    ]
  },
  "resources": {
    "consumed": [
      {
        "id": "visa_resource",
        "type": "exclusive",
        "description": "VISA resource string for USB/LAN/vendor transport."
      },
      {
        "id": "tcp_socket",
        "type": "exclusive",
        "description": "Host and TCP port, normally 5025."
      },
      {
        "id": "session_alias",
        "type": "exclusive_within_library",
        "description": "Unique named session."
      },
      {
        "id": "mainframe_channel",
        "type": "exclusive_for_mutation",
        "description": "Channel 1..4; coordinate concurrent test ownership."
      }
    ],
    "provided": [
      {
        "id": "dc_source",
        "quantity": [
          "voltage",
          "current",
          "power"
        ],
        "availability": "module-dependent"
      },
      {
        "id": "smu",
        "quantity": [
          "source_voltage",
          "source_current",
          "measure_voltage",
          "measure_current"
        ],
        "availability": "SMU module-dependent"
      },
      {
        "id": "electronic_load",
        "quantity": [
          "cc",
          "cv",
          "cr",
          "cp"
        ],
        "availability": "verified module-dependent; real load modules remain restricted unless explicitly supported"
      },
      {
        "id": "internal_measurement",
        "quantity": [
          "voltage",
          "current",
          "power"
        ],
        "availability": "module-dependent"
      }
    ]
  },
  "dependencies": {
    "runtime": [
      "Python >=3.10",
      "Robot Framework >=7,<9",
      "PyVISA >=1.14"
    ],
    "optional": [
      "pyvisa-py >=0.7 when no vendor VISA backend is installed"
    ],
    "external": [
      "Keysight IO Libraries Suite or another compatible VISA backend for VISA resources",
      "Network reachability for raw Ethernet",
      "Reviewed cabling, fixtures, DUT limits, and interlocks"
    ]
  },
