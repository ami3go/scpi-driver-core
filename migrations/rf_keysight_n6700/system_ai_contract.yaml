  "test_templates": [
    {
      "id": "TEMPLATE-READ-ONLY-DISCOVERY",
      "purpose": "Identify instrument and module map without intentional output changes.",
      "sequence": [
        "Connect To N6700",
        "Get N6700 Identity",
        "Discover N6700 Modules",
        "Get N6700 Protection Status per installed channel",
        "Get N6700 Output State or Load Input State",
        "Disconnect N6700"
      ],
      "risk": "low_but_existing_output_state_unknown"
    },
    {
      "id": "TEMPLATE-SAFE-SOURCE-CHANNEL",
      "purpose": "Configure, energize, measure, and shut down one source/SMU channel.",
      "preconditions": [
        "Site topology complete",
        "DUT limits approved",
        "interlock available",
        "channel reserved"
      ],
      "sequence": [
        "Connect and identify",
        "Discover modules",
        "Turn Off N6700 Output",
        "Configure limits with output=false",
        "Verify setpoint/protection readback",
        "Turn On N6700 Output",
        "Wait approved stabilization",
        "Measure/verify",
        "Turn Off N6700 Output",
        "Shutdown All N6700 Channels",
        "Disconnect"
      ],
      "risk": "high"
    },
    {
      "id": "TEMPLATE-EMERGENCY-SHUTDOWN",
      "purpose": "Bench response to fault, timeout, unexpected value, or operator stop.",
      "sequence": [
        "Attempt Turn Off for known active channels",
        "Shutdown All N6700 Channels",
        "Use external interlock/emergency stop if software communication is absent or shutdown is not verified",
        "Record errors and final observed state",
        "Disconnect only after energy state is controlled"
      ],
      "risk": "critical"
    }
  ],
  "bench_constraints": {
    "operator_actions": [
      "Verify wiring and polarity",
      "Set/confirm external interlock",
      "Approve DUT limits",
      "Remain available for first energization",
      "Use emergency disconnect when software shutdown is not verified"
    ],
    "safety_zones": [
      {
        "id": "ZONE-DC-OUTPUT",
