rfds017_version: '3.0'
identity:
  driver_name: rf_hp34401a.Hp34401ALibrary
  driver_version: 26.7.0
  contract_version: 1.0.0
  supported_models:
  - 34401A
  instrument_class: DMM
  primary_role: Measures electrical voltage, current, resistance, frequency, period, continuity, and diode response for automated
    verification.
  api_version: 1.1.0
mental_model:
  physical_object: One HP, Agilent, or Keysight 34401A bench digital multimeter per named alias, connected by VISA/GPIB or
    RS-232.
  configuration_persistence: PERSISTS_UNTIL_RESET
  blocking_behavior: All public keywords are synchronous and blocking; stable resistance may block until max_wait.
  concurrency:
    max_parallel_sessions: 1
    thread_safe: false
    multiple_named_sessions_supported: true
    rule: Calls may target multiple aliases sequentially; concurrent calls to one library instance are not qualified.
  ownership: Each open alias exclusively owns one physical VISA or serial resource until disconnect.
  measurement_memory: Each alias stores only its latest accepted or rejected MeasurementReading metadata.
state_machine:
  scope: PER_ALIAS
  states:
  - DISCONNECTED
  - CONNECTED_LOCAL
  - CONNECTED_REMOTE
  - CONFIGURED
  - WAITING_FOR_TRIGGER
  - MEASURING
  - HAS_UNREAD_OUTPUT
  - ERROR_RECOVERY
  initial_state: DISCONNECTED
  transitions:
  - from: DISCONNECTED
    to: CONNECTED_REMOTE
    via_capability: Connect DMM
  - from: CONNECTED_REMOTE
    to: CONFIGURED
    via_capability: Configure DC Voltage
  - from: CONFIGURED
    to: CONNECTED_REMOTE
    via_capability: Read DMM
  - from: CONFIGURED
    to: WAITING_FOR_TRIGGER
    via_capability: Initiate DMM Measurement
  - from: WAITING_FOR_TRIGGER
    to: HAS_UNREAD_OUTPUT
    via_capability: Send DMM Bus Trigger
  - from: HAS_UNREAD_OUTPUT
    to: CONNECTED_REMOTE
    via_capability: Fetch DMM Readings
  - from: ERROR_RECOVERY
    to: CONNECTED_REMOTE
    via_capability: Recover DMM
  - from: CONNECTED_REMOTE
    to: DISCONNECTED
    via_capability: Disconnect DMM
resources:
  consumes:
  - name: DMM_SESSION_ALIAS
    access: EXCLUSIVE
    description: Named logical ownership of one connected DMM.
  - name: VISA_RESOURCE
    access: EXCLUSIVE
    description: One GPIB, USBTMC, or supported VISA endpoint when VISA transport is selected.
  - name: SERIAL_PORT
    access: EXCLUSIVE
    description: One RS-232 host port when serial transport is selected.
  - name: DMM_INPUT_TERMINALS
    access: EXCLUSIVE
    description: Front or rear measurement terminals and associated fixture path.
  provides:
  - name: ELECTRICAL_MEASUREMENT
    description: Timestamped scalar measurement plus validity, overload, function, unit, range, timing, and recovery metadata.
  - name: PASS_FAIL_ORACLE
    description: Robot assertion keywords for range, tolerance, validity, overload, identity, terminal, and error queue.
  physical_signals:
    inputs:
    - name: INPUT_HI
      signal: ELECTRICAL_MEASUREMENT_INPUT
      connector: BANANA_FRONT_OR_REAR
    - name: INPUT_LO
      signal: ELECTRICAL_RETURN
      connector: BANANA_FRONT_OR_REAR
    - name: SENSE_HI
      signal: FOUR_WIRE_SENSE
      connector: BANANA_FRONT_OR_REAR
    - name: SENSE_LO
      signal: FOUR_WIRE_SENSE_RETURN
      connector: BANANA_FRONT_OR_REAR
    outputs:
    - name: MEASUREMENT_DATA
      signal: DIGITAL_RESULT
      connector: ROBOT_FRAMEWORK_RETURN
dependencies:
  requires_before: []
  enables_after:
  - DUT verdict evaluation
  - calibration comparison
  - production report generation
  conflicts_with:
  - Any process or driver controlling the same VISA resource, serial port, or DMM terminals.
connection_points:
  inputs:
  - name: INPUT_HI
    signal: VOLTAGE_CURRENT_RESISTANCE_FREQUENCY
    connector: BANANA
  - name: INPUT_LO
    signal: REFERENCE_RETURN
    connector: BANANA
  - name: SENSE_HI
    signal: FOUR_WIRE_SENSE
    connector: BANANA
  - name: SENSE_LO
    signal: FOUR_WIRE_SENSE_RETURN
    connector: BANANA
  outputs: []
measurement_quality:
  dc_voltage:
    preferred_for:
    - CALIBRATION
    - PRODUCTION
    - VERIFICATION
    confidence: HIGH
    accuracy_source: MANUFACTURER_SPEC
  resistance:
    preferred_for:
    - CALIBRATION
    - PRODUCTION
    - VERIFICATION
    confidence: HIGH
    accuracy_source: MANUFACTURER_SPEC
  ac_voltage:
    preferred_for:
    - VERIFICATION
    confidence: HIGH
    accuracy_source: MANUFACTURER_SPEC
  current:
    preferred_for:
    - VERIFICATION
    confidence: HIGH
    accuracy_source: MANUFACTURER_SPEC
    safety_note: Requires correct series connection and fused current terminal.
implementation_status:
  maturity: D0_DEVELOPMENT_CANDIDATE
  validation:
  - UNIT_TESTED_BASELINE
  - SIMULATOR_COMPONENT_VALIDATED
  - RFDS019_STATIC_COMPLETE
  pending:
  - OFFICIAL_ROBOT_RFDS019_EXECUTION
  - REAL_HARDWARE_ALL_API_EXECUTION
  - RFDS_CORE_INTEGRATION
  - RFDS004_V2_TRANSPORT_MIGRATION
  - LONG_DURATION_TESTED
