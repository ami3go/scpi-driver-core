errors:
- name: NO_ACTIVE_SESSION
  class: STATE_VIOLATION
  meaning: No selected session exists.
  detection: Hp34401ARobotError contains 'No DMM session is open'.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Call `Connect DMM` or `Select DMM` with an open alias.
- name: CONNECTION_FAILED
  class: COMMUNICATION
  meaning: Transport connection or initialization failed.
  detection: Hp34401ARobotError is raised by a connection keyword.
  post_error_state: REQUIRES_REINIT
  retry: RETRY_AFTER_RESET
  recovery: Verify resource ownership and backend, then call `Connect DMM` once.
- name: IDENTITY_MISMATCH
  class: CONFIGURATION
  meaning: Connected instrument is not a supported 34401A.
  detection: Connection or model assertion reports identity mismatch.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Correct the resource address and reconnect to a supported 34401A.
- name: MISSING_BACKEND
  class: CONFIGURATION
  meaning: Requested PyVISA or PySerial backend is not installed.
  detection: Error message requests installation of the relevant optional dependency.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Install `rf-hp34401a[visa]`, `[serial]`, or `[hardware]`.
- name: RESOURCE_CONFLICT
  class: CONFIGURATION
  meaning: Alias or physical transport resource is already owned.
  detection: Connection reports duplicate alias or backend reports resource busy.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Close the existing owner or use a unique alias and exclusive resource.
- name: VALIDATION_ERROR
  class: CONFIGURATION
  meaning: An argument is outside the supported enum, range, or format.
  detection: ValueError or Hp34401ARobotError is raised before unsafe I/O.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Correct the argument using the capability definition.
- name: COMM_TIMEOUT
  class: COMMUNICATION
  meaning: The instrument did not answer before timeout.
  detection: Core InstrumentTimeoutError is wrapped by Hp34401ARobotError.
  post_error_state: STATE_UNDEFINED
  retry: RETRY_AFTER_RESET
  recovery: Call `Recover DMM`; verify health; retry once only when capability retry permits.
- name: COMMUNICATION_ERROR
  class: COMMUNICATION
  meaning: Transport or SCPI framing failed.
  detection: Core communication or protocol error is wrapped by Hp34401ARobotError.
  post_error_state: STATE_UNDEFINED
  retry: RETRY_AFTER_RESET
  recovery: Call `Recover DMM`, then `Get DMM Health`; reconnect if recovery fails.
- name: STATE_VIOLATION
  class: STATE_VIOLATION
  meaning: Keyword is invalid in the current command state.
  detection: Core ProtocolError or adapter state guard is raised.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Query `Get DMM State` and execute the required configuration or trigger step.
- name: SCPI_ERROR
  class: HARDWARE_FAULT
  meaning: The instrument reports a non-zero SCPI error.
  detection: Error queue assertion or guarded command raises an instrument error.
  post_error_state: STATE_UNDEFINED
  retry: NEVER_RETRY
  recovery: Read the error queue, correct the command or bench state, then clear status if appropriate.
- name: OVERLOAD
  class: HARDWARE_FAULT
  meaning: The reading exceeds the selected range or supported measurement input.
  detection: Measurement keyword rejects an overload sentinel and stores metadata with is_overload=true.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Remove or reduce the input, correct wiring, or choose a safe higher range.
- name: INVALID_READING
  class: HARDWARE_FAULT
  meaning: Instrument response cannot be accepted as a valid scalar reading.
  detection: Measurement keyword reports is_valid=false or missing value.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Inspect raw response and diagnostics; correct the bench before repeating.
- name: UNSTABLE_MEASUREMENT
  class: TRANSIENT
  meaning: Resistance stability criteria were not met within max_wait.
  detection: Read Stable Resistance raises MeasurementNotStableError.
  post_error_state: STATE_UNCHANGED
  retry: SAFE_TO_RETRY
  recovery: Increase settling time only after verifying fixture isolation and leakage.
- name: NO_READING
  class: STATE_VIOLATION
  meaning: No accepted last reading exists for the selected alias.
  detection: Get Last DMM Reading reports no reading available.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Run a measurement keyword first.
- name: ASSERTION_FAILED
  class: CONFIGURATION
  meaning: A returned reading or state does not satisfy the declared oracle.
  detection: Robot assertion keyword raises AssertionError.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Treat as test failure; inspect measured value, unit, limits, and bench state.
- name: SELF_TEST_FAILED
  class: HARDWARE_FAULT
  meaning: Instrument self-test returned a non-zero code.
  detection: DMM Self Test Should Pass raises AssertionError.
  post_error_state: STATE_UNDEFINED
  retry: NEVER_RETRY
  recovery: Remove DUT connections as required by site procedure and service the instrument.
- name: TERMINAL_MISMATCH
  class: SAFETY_TRIP
  meaning: Front/rear terminal selection differs from the required fixture connection.
  detection: Require DMM Input Terminal fails.
  post_error_state: SAFE_STATE
  retry: NEVER_RETRY
  recovery: Move the selector or fixture to the declared terminal and re-verify.
- name: CALIBRATION_BLOCKED
  class: SAFETY_TRIP
  meaning: A calibration-affecting raw SCPI command was blocked by policy.
  detection: Guarded raw command raises calibration-command protection error.
  post_error_state: STATE_UNCHANGED
  retry: NEVER_RETRY
  recovery: Do not bypass protection; use an authorized calibration procedure and explicit opt-in.
- name: CLEANUP_FAILED
  class: COMMUNICATION
  meaning: One or more sessions failed to close during aggregate cleanup.
  detection: Close All DMMs raises after attempting every alias.
  post_error_state: STATE_UNDEFINED
  retry: NEVER_RETRY
  recovery: Physically verify bench state and close remaining resources manually.
safety:
  dangerous_operations:
  - keyword: Measure DC Current
    condition: DMM current input connected across a voltage source or expected current exceeds selected range
    risk_level: HIGH
  - keyword: Measure AC Current
    condition: DMM current input connected across a voltage source or expected current exceeds selected range
    risk_level: HIGH
  - keyword: Measure 2 Wire Resistance
    condition: DUT externally energized
    risk_level: HIGH
  - keyword: Measure 4 Wire Resistance
    condition: DUT externally energized
    risk_level: HIGH
  - keyword: Write DMM Command
    condition: Command changes undocumented state or calibration
    risk_level: HIGH
  forbidden_sequences:
  - never:
    - ANY_POWER_SOURCE.Enable Output
    - Measure 2 Wire Resistance
    reason: Resistance measurement injects test current and requires a de-energized DUT.
  - never:
    - ANY_POWER_SOURCE.Enable Output
    - Measure 4 Wire Resistance
    reason: Four-wire resistance measurement requires a de-energized DUT.
  - never:
    - Set DMM Trigger Source  source=BUS
    - Read DMM
    reason: READ? with BUS trigger is forbidden; use the bus-trigger workflow.
  required_delays:
  - after: ANY_RELAY.Close Relay
    before: ANY_MEASUREMENT
    min_delay_s: 0.2
  - after: ANY_DUT_SETPOINT_CHANGE
    before: Read Stable Resistance
    min_delay_s: 0.5
  hardware_limits:
  - quantity: dc_voltage_measurement_range
    unit: V
    max: 1000.0
  - quantity: ac_voltage_measurement_range
    unit: V
    max: 750.0
  - quantity: dc_current_measurement_range
    unit: A
    max: 3.0
  - quantity: ac_current_measurement_range
    unit: A
    max: 3.0
  - quantity: resistance_measurement_range
    unit: OHM
    max: 100000000.0
  safe_shutdown_sequence:
  - Close All DMMs
verification_objectives:
- id: VO-DMM-001
  goal: Verify that the connected instrument is a supported 34401A.
  procedure:
  - Connect DMM  resource=${DMM_RESOURCE}  transport=AUTO  alias=dmm
  - Identify DMM  alias=dmm
  - DMM Model Should Be 34401A  alias=dmm
  oracle:
    type: EXACT_MATCH
    expected: 34401A
    measured_by: Identify DMM.model
  requires_drivers: []
  risk_level: NONE
  requirements_verified:
  - RFDS-DMM-IDENTITY
- id: VO-DMM-002
  goal: Verify DC voltage against caller-provided inclusive limits.
  procedure:
  - Configure DC Voltage  range_value=AUTO  nplc=10  alias=dmm
  - Measure DC Voltage  range_value=AUTO  nplc=10  alias=dmm
  - DMM Reading Should Be Between  ${MIN_V}  ${MAX_V}  alias=dmm
  oracle:
    type: RANGE
    min: ${MIN_V}
    max: ${MAX_V}
    unit: V
    measured_by: Measure DC Voltage
  requires_drivers:
  - DC_SOURCE_OR_DUT
  risk_level: LOW
  requirements_verified:
  - RFDS-DMM-DCV
- id: VO-DMM-003
  goal: Verify a de-energized resistance path against relative tolerance.
  procedure:
  - REQUIRE external sources disabled
  - Read Stable Resistance  expected_ohm=${EXPECTED_OHM}  alias=dmm
  - DMM Reading Should Be Close To  ${EXPECTED_OHM}  relative_tolerance=${REL_TOL}  alias=dmm
