setup_teardown:
  suite_setup:
  - Connect DMM  resource=${DMM_RESOURCE}  transport=AUTO  alias=dmm
  - DMM Model Should Be 34401A  alias=dmm
  - DMM Error Queue Should Be Empty  alias=dmm
  suite_teardown:
  - Close All DMMs
  teardown_safe_from_any_state: true
  abort_semantics: Generated suites shall execute teardown using Run Keyword And Ignore Error or equivalent finally semantics.
planning_hints:
- Use `Connect DMM` for transport-neutral generated tests and retain explicit transport keywords only when backend-specific
  options are required.
- Call `Require DMM Input Terminal` before automated fixtures where front/rear selector mismatch can route the wrong circuit.
- Prefer `Read Stable Resistance` for switched high-resistance paths and declare relay plus DUT settling separately in the
  bench contract.
- Treat current measurement as HIGH risk and require a current-limited series path verified by the RFDS-018 bench topology.
- Never infer physical wiring from a VISA resource; combine this contract with the bench `system_ai_contract.yaml`.
limitations:
- The driver cannot determine actual external wiring, DUT power state, relay routing, or available independent protection.
- The 34401A front/rear mechanical terminal position may be UNKNOWN on firmware or transports that do not support the query.
- Physical HIL validation, long-duration stability, and concurrent thread execution are not yet certified for release v26.06.
- Vendor VISA runtime software is external and is not installed by this package.
- Raw SCPI can invalidate typed driver state and is intended for diagnostics only.
