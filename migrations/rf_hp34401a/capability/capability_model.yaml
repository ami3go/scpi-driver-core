    risk: low
    unit: ohm
    timing: {timeout_s: 60.0, cancellable: false, retry_safe: false}
  - capability_id: measure.resistance.four_wire
    binding: {robot_keyword: Measure 4 Wire Resistance}
    support_state: supported
    risk: low
    unit: ohm
    timing: {timeout_s: 60.0, cancellable: false, retry_safe: false}
  - capability_id: measure.frequency
    binding: {robot_keyword: Measure Frequency}
    support_state: supported
    risk: low
    unit: Hz
    timing: {timeout_s: 60.0, cancellable: false, retry_safe: false}
  - capability_id: measure.period
    binding: {robot_keyword: Measure Period}
    support_state: supported
    risk: low
    unit: s
    timing: {timeout_s: 60.0, cancellable: false, retry_safe: false}
  - capability_id: measure.continuity
    binding: {robot_keyword: Measure Continuity}
    support_state: supported
    risk: low
