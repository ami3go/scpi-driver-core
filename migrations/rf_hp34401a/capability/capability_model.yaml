    binding: {robot_keyword: Query DMM Command}
    support_state: supported
    risk: medium
    explicit_opt_in: true
    timing: {timeout_s: 10.0, cancellable: false, retry_safe: false}
  - capability_id: simulation.instrument.open
    binding: {robot_keyword: Open Simulated DMM}
    support_state: supported
    risk: none
    timing: {timeout_s: 10.0, cancellable: false, retry_safe: false}
validation:
  valid: true
  errors: []
  warnings: []
extensions:
  rf_hp34401a:
    supported_models: [34401A]
