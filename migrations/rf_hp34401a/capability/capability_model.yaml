    binding: {robot_keyword: Read Stable Resistance}
    support_state: supported
    risk: low
    unit: ohm
    timing: {timeout_s: 60.0, cancellable: false, retry_safe: false}
  - capability_id: acquisition.trigger.configure
    binding: {robot_keyword: Set DMM Trigger Source}
    support_state: supported
    risk: low
    timing: {timeout_s: 10.0, cancellable: false, retry_safe: false}
