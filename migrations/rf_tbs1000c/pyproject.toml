[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-tbs1000c"
version = "26.2"
description = "Robot Framework driver for the Tektronix TBS1000C series digital storage oscilloscopes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "robotframework>=7.0,<9",
  # Transports, SCPI framing, and IEEE-488.2 block handling come from the core
  # rather than being reimplemented here.
  "scpi-driver-core>=0.1.0.dev0",
]

[project.optional-dependencies]
usbtmc = ["scpi-driver-core[visa]>=0.1.0.dev0"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "build>=1,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_tbs1000c*", "tbs1000c*"]
exclude = ["tests*", "examples*", "task*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
