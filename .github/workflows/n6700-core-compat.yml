name: N6700 downstream core compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        core-ref:
          - ec19ab88906d8e6ac270b30d7615ce7e75dc6a08
          - 3d2c25c5e4e141749478f84631e8215d2984792d
          # The revision under test (PR merge commit or dispatched branch).
          - workspace
    steps:
      - name: Check out this core revision
        if: matrix.core-ref == 'workspace'
        uses: actions/checkout@v4
        with:
          path: core

      - name: Fetch N6700 driver at a fixed revision
        uses: actions/checkout@v4
        with:
          repository: ami3go/keysight-n6700-driver
          ref: 29e8969f42713effedf08148f0708cbf04e4217f
          path: downstream

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install isolated test dependencies and selected SCPI core
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.core-ref }}" = "workspace" ]; then
            python -m pip install "./core[all]"
          else
            python -m pip install \
              "scpi-driver-core[all] @ git+https://github.com/ami3go/scpi-driver-core@${{ matrix.core-ref }}"
          fi
          python -m pip install \
            pytest pytest-cov pytest-timeout hypothesis pyvisa-sim \
            jsonschema PyYAML robotframework "typing-extensions>=4.8"
          python -m pip install --no-deps -e ./downstream
          python -m pip check
          python -c 'from importlib.metadata import version; print("Installed core:", version("scpi-driver-core")); print("N6700 driver:", version("keysight-n6700-driver"))'

      - name: Verify downstream simulator, transient, scope, digitizer, SCPI and integration
        working-directory: downstream
        env:
          PYTEST_ADDOPTS: "--timeout=30"
        run: |
          pytest -m "not hardware" \
            --cov=keysight_n6700 --cov-report=term-missing \
            --junitxml="../n6700-results-${{ matrix.python-version }}.xml"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n6700-core-${{ matrix.python-version }}-${{ matrix.core-ref }}
          path: n6700-results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
