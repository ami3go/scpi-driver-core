name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,all]"
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov=scpi_driver_core --cov-report=term-missing
      - name: Build
        if: matrix.python-version == '3.13'
        run: python -m build
