[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scpi-driver-core"
version = "0.1.0.dev6"
description = "Framework-independent shared infrastructure for Python SCPI/IEEE-488.2 instrument drivers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandr Chasnyk" }]
keywords = ["scpi", "ieee488", "instrumentation", "test-automation", "pyvisa", "laboratory"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
visa = ["pyvisa>=1.14"]
serial = ["pyserial>=3.5"]
all = ["pyvisa>=1.14", "pyserial>=3.5"]
dev = [
  "build>=1.2",
  "hypothesis>=6.168",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.4,!=2.5.0",
  "pyvisa-sim>=0.7.1",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scpi_driver_core"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
timeout = 30
session_timeout = 600
markers = [
  "integration: integration tests that may use local simulated endpoints",
  "hardware: tests requiring physical hardware",
  "property: Hypothesis property-based protocol and model tests",
  "visa_sim: integration tests using the PyVISA-sim backend",
  "watchdog: concurrency and hang-regression tests with explicit pytest-timeout bounds",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["task"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["scpi_driver_core"]
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["scpi_driver_core"]

[tool.coverage.report]
show_missing = true
fail_under = 90
